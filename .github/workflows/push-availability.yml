name: MOZ - verificar disponibilidade para notificacoes externas
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moz-push-availability
  cancel-in-progress: false
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar servidor de notificacoes
        run: |
          set -eu
          for attempt in 1 2 3 4; do
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 https://moz.runasp.net/health); then
              if printf '%s' "$response" | jq -e '.app == "MOZ" and .status == "ok" and .database == "ready"' >/dev/null; then
                echo "MOZ pronto; o serviço residente processa eventos operacionais."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::MOZ indisponível para processamento de notificações."
          exit 1
