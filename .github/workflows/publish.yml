name: MOZ - validate and deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moz-production
  cancel-in-progress: false
jobs:
  build_test_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate frontend
        run: |
          node --check wwwroot/app.js
          node --check wwwroot/service-worker.js
          node -e "JSON.parse(require('fs').readFileSync('wwwroot/manifest.webmanifest','utf8'))"
      - name: Restore
        run: dotnet restore MOZ.csproj
      - name: Build
        run: dotnet build MOZ.csproj --configuration Release --no-restore
      - name: Run rules
        run: dotnet run --project tests/Moz.Rules.csproj --configuration Release
      - name: Publish
        run: dotnet publish MOZ.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false
      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: moz-production-${{ github.sha }}
          path: ./publish
          retention-days: 14
      - name: WebDeploy direct
        shell: pwsh
        env:
          DEPLOY_SITE: ${{ secrets.WEBSITE_NAME }}
          DEPLOY_SERVER: ${{ secrets.SERVER_COMPUTER_NAME }}
          DEPLOY_USER: ${{ secrets.SERVER_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $site = $env:DEPLOY_SITE.Trim()
          $server = $env:DEPLOY_SERVER.Trim()
          if ($site -ne "site111488" -or $env:DEPLOY_USER.Trim() -ne $site) { throw "Site or login does not match MOZ." }
          if ($server -notmatch '^https://') { $server = "https://" + $server }
          $uri = [Uri]$server
          if ($uri.Host -ne "site111488.siteasp.net" -or $uri.Port -ne 8172 -or $uri.Scheme -ne "https") { throw "Unexpected MOZ WebDeploy server." }
          $endpoint = $uri.GetLeftPart([UriPartial]::Authority) + "/msdeploy.axd?site=" + $site
          $exe = Join-Path ${env:ProgramFiles(x86)} "IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (!(Test-Path $exe)) { throw "MSDeploy executable not found." }
          $src = (Resolve-Path ./publish).Path
          $dest = "-dest:contentPath='$site',computerName='$endpoint',userName='$($env:DEPLOY_USER)',password='$($env:DEPLOY_PASSWORD)',authType=Basic,includeAcls=False"
          & $exe "-verb:sync" "-source:contentPath='$src'" $dest "-enableRule:AppOffline" "-enableRule:DoNotDeleteRule" "-disableLink:AppPoolExtension" "-disableLink:ContentExtension" "-disableLink:CertificateExtension" "-retryAttempts:2"
          if ($LASTEXITCODE -ne 0) { throw "Direct WebDeploy failed (exit $LASTEXITCODE)." }
      - name: Production health
        shell: pwsh
        run: |
          for ($i=1; $i -le 18; $i++) {
            try {
              $h=Invoke-RestMethod -Uri "https://moz.runasp.net/health" -TimeoutSec 15
              if ($h.status -eq "ok" -and $h.database -eq "ready" -and $h.version -eq "0.1.0") { exit 0 }
            } catch { Write-Host "Health check unavailable ($i)." }
            Start-Sleep -Seconds 5
          }
          throw "MOZ production health check failed."
