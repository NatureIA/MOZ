name: MOZ - validate and deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moz-production
  cancel-in-progress: false
jobs:
  build_test_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Preflight HTTPS and deployment configuration
        shell: pwsh
        env:
          DEPLOY_SITE: ${{ secrets.WEBSITE_NAME }}
          DEPLOY_SERVER: ${{ secrets.SERVER_COMPUTER_NAME }}
          DEPLOY_USER: ${{ secrets.SERVER_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($key in @("DEPLOY_SITE","DEPLOY_SERVER","DEPLOY_USER","DEPLOY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) { throw "Missing deployment configuration: $key" }
          }
          $server = $env:DEPLOY_SERVER.Trim()
          if ($server -notmatch '^https://') { $server = "https://" + $server }
          $uri = [Uri]$server
          if ($env:DEPLOY_SITE.Trim() -ne "site111488" -or $env:DEPLOY_USER.Trim() -ne "site111488" -or $uri.Host -ne "site111488.siteasp.net" -or $uri.Port -ne 8172 -or $uri.Scheme -ne "https") { throw "MOZ deployment destination does not match expected site." }
          $code = & curl.exe --silent --show-error --max-time 20 --retry 2 --output NUL --write-out "%{http_code}" "https://moz.runasp.net/health"
          if ($LASTEXITCODE -ne 0 -or $code -eq "000") { throw "HTTPS/TLS unavailable before deployment. Validate certificate and hosting connectivity." }
          $redirect = & curl.exe --silent --show-error --max-time 20 --output NUL --write-out "%{redirect_url}" "http://moz.runasp.net/health"
          if ($LASTEXITCODE -ne 0 -or $redirect -notmatch '^https://moz\.runasp\.net(/|$)') { throw "HTTP to HTTPS redirect unavailable before deployment." }
          Write-Host "Deployment configuration, HTTPS certificate and redirect passed preflight."
      - name: Install map library
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false maplibre-gl@4.7.1 @microsoft/signalr@8.0.7 jsdom@26.1.0 @mapbox/vector-tile@2.0.4 pbf@4.0.1 esbuild@0.25.12
          New-Item -ItemType Directory -Force wwwroot/vendor | Out-Null
          Copy-Item node_modules/maplibre-gl/dist/maplibre-gl.js wwwroot/vendor/
          Copy-Item node_modules/maplibre-gl/dist/maplibre-gl.css wwwroot/vendor/
          Copy-Item node_modules/@microsoft/signalr/dist/browser/signalr.min.js wwwroot/vendor/
          Copy-Item node_modules/maplibre-gl/LICENSE.txt wwwroot/vendor/ -ErrorAction SilentlyContinue
          npx --no-install esbuild routing/browser.mjs --bundle --minify --format=iife --outfile=wwwroot/vendor/road-match.js
          if ($LASTEXITCODE -ne 0) { throw "Road matching bundle failed" }
      - name: Validate frontend
        run: |
          node --check wwwroot/app.js
          node --check wwwroot/maps.js
          node --check wwwroot/service-worker.js
          node tests/live-refresh.test.cjs
          node tests/road-match.test.mjs
          node --check wwwroot/vendor/road-match.js
          node -e "JSON.parse(require('fs').readFileSync('wwwroot/manifest.webmanifest','utf8'))"
      - name: Restore
        run: dotnet restore MOZ.csproj
      - name: Build
        run: dotnet build MOZ.csproj --configuration Release --no-restore
      - name: Run rules
        run: dotnet run --project tests/Moz.Rules.csproj --configuration Release
      - name: Publish
        run: dotnet publish MOZ.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false
      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: moz-production-${{ github.sha }}
          path: ./publish
          retention-days: 14
      - name: WebDeploy direct
        shell: pwsh
        env:
          DEPLOY_SITE: ${{ secrets.WEBSITE_NAME }}
          DEPLOY_SERVER: ${{ secrets.SERVER_COMPUTER_NAME }}
          DEPLOY_USER: ${{ secrets.SERVER_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $site = $env:DEPLOY_SITE.Trim()
          $server = $env:DEPLOY_SERVER.Trim()
          if ($site -ne "site111488" -or $env:DEPLOY_USER.Trim() -ne $site) { throw "Site or login does not match MOZ." }
          if ($server -notmatch '^https://') { $server = "https://" + $server }
          $uri = [Uri]$server
          if ($uri.Host -ne "site111488.siteasp.net" -or $uri.Port -ne 8172 -or $uri.Scheme -ne "https") { throw "Unexpected MOZ WebDeploy server." }
          $endpoint = $uri.GetLeftPart([UriPartial]::Authority) + "/msdeploy.axd?site=" + $site
          $exe = Join-Path ${env:ProgramFiles(x86)} "IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (!(Test-Path $exe)) { throw "MSDeploy executable not found." }
          $src = (Resolve-Path ./publish).Path
          $dest = "-dest:contentPath='$site',computerName='$endpoint',userName='$($env:DEPLOY_USER)',password='$($env:DEPLOY_PASSWORD)',authType=Basic,includeAcls=False"
          & $exe "-verb:sync" "-source:contentPath='$src'" $dest "-enableRule:AppOffline" "-enableRule:DoNotDeleteRule" "-disableLink:AppPoolExtension" "-disableLink:ContentExtension" "-disableLink:CertificateExtension" "-retryAttempts:2"
          if ($LASTEXITCODE -ne 0) { throw "Direct WebDeploy failed (exit $LASTEXITCODE)." }
      - name: HTTP availability diagnostics
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://moz.runasp.net/health" -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 15
            Write-Host "HTTP status=$([int]$r.StatusCode)"
            try {
              $h = $r.Content | ConvertFrom-Json
              Write-Host "HTTP application=$($h.app) version=$($h.version) status=$($h.status) database=$($h.database) step=$($h.databaseStep) type=$($h.databaseErrorType) sql=$($h.databaseErrorNumber)"
            } catch {}
          } catch { Write-Host "HTTP probe failed: $($_.Exception.GetType().Name)" }
      - name: Production health
        shell: pwsh
        run: |
          for ($i=1; $i -le 18; $i++) {
            try {
              $h=Invoke-RestMethod -Uri "https://moz.runasp.net/health" -TimeoutSec 15
              if ($h.status -eq "ok" -and $h.database -eq "ready" -and $h.version -eq "0.2.14") { exit 0 }
              Write-Host "Health status=$($h.status) database=$($h.database) version=$($h.version) step=$($h.databaseStep) type=$($h.databaseErrorType) sql=$($h.databaseErrorNumber)"
              if ($h.app -eq "MOZ" -and $h.version -eq "0.2.14" -and $h.status -eq "error") { break }
            } catch {
              $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { "none" }
              Write-Host "Health HTTP=$code attempt=$i type=$($_.Exception.GetType().Name)"
            }
            Start-Sleep -Seconds 5
          }
          throw "MOZ production health check failed."
