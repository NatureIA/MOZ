name: MOZDriver
options:
  bundleIdPrefix: net.moz
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  MOZDriver:
    type: application
    platform: iOS
    sources:
      - path: MOZDriver
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.moz.driver
        INFOPLIST_FILE: MOZDriver/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets: [MOZDriverTests]
  MOZDriverTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MOZDriverTests]
    dependencies:
      - target: MOZDriver
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.moz.driver.tests
